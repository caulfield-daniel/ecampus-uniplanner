# ============================================
# CI: сборка, тесты и drift-guard генерации типов
# ============================================
# Триггеры: push в main/dev и все pull request.
# Джобы:
#   schema-drift — регенерация api/schemas + TS-типов не должна менять коммиты
#   shared       — golden-снапшоты JSON Schema + валидаторы (KMP)
#   backend      — сервисные тесты + contextLoads на живой PostgreSQL
#   web          — сборка, тесты, линт
# ============================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  BUN_VERSION: '1.3.14'

jobs:
  schema-drift:
    name: Drift-guard (JSON Schema + TS-типы)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # gradlew закоммичен с битом 755 — chmod в CI не нужен (иначе mode-drift).
      - name: Генерация JSON Schema из shared (KMP → api/schemas)
        run: ./gradlew :shared:generateJsonSchemas

      - name: Установка зависимостей и генерация TS-типов web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run generate:types

      # Drift-guard: регенерация не должна менять закоммиченные артефакты
      # (api/schemas/*.json, web/src/shared/types/generated/*.d.ts).
      - name: Drift-guard (git diff --exit-code)
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Незакоммиченные изменения после регенерации:"
            git status --porcelain
            exit 1
          fi

  shared:
    name: Shared (KMP) tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Тесты shared (golden-снапшоты JSON Schema + валидаторы)
        run: ./gradlew :shared:jvmTest

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uniplanner_backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: uniplanner_backend
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret-key-min-256-bits-long-for-hs256-only-in-ci
      UNIVERSITY_AUTH_ENCRYPTION_KEY: ci-university-auth-encryption-key-only-in-ci
      PARSER_BASE_URL: http://localhost:8000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Тесты backend (сервисы + contextLoads на PostgreSQL)
        run: ./gradlew :backend:test

      - name: JaCoCo отчёт
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html
          if-no-files-found: ignore

  web:
    name: Web (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Установка зависимостей
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Сборка
        working-directory: web
        run: bun run build

      - name: Тесты
        working-directory: web
        run: bun run test

      - name: Линт
        working-directory: web
        run: bun run lint
