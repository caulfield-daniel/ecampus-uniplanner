openapi: 3.0.0
info:
  title: Ecampus UniPlanner API
  description: |
    API для студенческого органайзера. Поддерживает регистрацию, вход, 
    управление задачами и заметками, а также просмотр расписания по группе.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Ktor Backend (основной API)
  - url: http://localhost:8000/api/v1
    description: FastAPI Parser (внутренний API)

tags:
  - name: auth
    description: Аутентификация
  - name: tasks
    description: Задачи пользователя
  - name: notes
    description: Заметки пользователя
  - name: schedule
    description: Расписание занятий
  - name: groups
    description: Справочник групп
  - name: parser
    description: Парсер расписания (внутренний API)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Общие схемы
    ErrorResponse:
      $ref: './common.yaml#/ErrorResponse'

    # Backend API схемы
    User:
      $ref: './backend-api.yaml#/User'
    RegisterRequest:
      $ref: './backend-api.yaml#/RegisterRequest'
    LoginRequest:
      $ref: './backend-api.yaml#/LoginRequest'
    LoginResponse:
      $ref: './backend-api.yaml#/LoginResponse'
    Task:
      $ref: './backend-api.yaml#/Task'
    TaskInput:
      $ref: './backend-api.yaml#/TaskInput'
    Note:
      $ref: './backend-api.yaml#/Note'
    NoteInput:
      $ref: './backend-api.yaml#/NoteInput'
    Lesson:
      $ref: './backend-api.yaml#/Lesson'
    GroupInfo:
      $ref: './backend-api.yaml#/GroupInfo'

    # Parser API схемы
    Institute:
      $ref: './parser-api.yaml#/Institute'
    Specialty:
      $ref: './parser-api.yaml#/Specialty'
    AcademicGroup:
      $ref: './parser-api.yaml#/AcademicGroup'
    Teacher:
      $ref: './parser-api.yaml#/Teacher'
    Room:
      $ref: './parser-api.yaml#/Room'
    ParserStatusResponse:
      $ref: './parser-api.yaml#/ParserStatusResponse'
    ParserSyncRequest:
      $ref: './parser-api.yaml#/ParserSyncRequest'

paths:
  # Backend API paths
  /auth/register:
    $ref: './backend-api.yaml#/auth_register'
  /auth/login:
    $ref: './backend-api.yaml#/auth_login'
  /auth/me:
    $ref: './backend-api.yaml#/auth_me'
  /tasks:
    $ref: './backend-api.yaml#/tasks_collection'
  /tasks/{id}:
    $ref: './backend-api.yaml#/tasks_item'
  /notes:
    $ref: './backend-api.yaml#/notes_collection'
  /notes/{id}:
    $ref: './backend-api.yaml#/notes_item'
  /schedule:
    $ref: './backend-api.yaml#/schedule_get'
  /groups:
    $ref: './backend-api.yaml#/groups_get'

  # Parser API paths
  /parser/status:
    $ref: './parser-api.yaml#/parser_status'
  /parser/sync:
    $ref: './parser-api.yaml#/parser_sync'
  /parser/institutes:
    $ref: './parser-api.yaml#/parser_institutes'
  /parser/specialties:
    $ref: './parser-api.yaml#/parser_specialties'
  /parser/groups:
    $ref: './parser-api.yaml#/parser_groups'