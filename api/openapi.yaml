openapi: 3.1.0
info:
  title: Ecampus UniPlanner API
  description: |
    API для студенческого органайзера. Поддерживает регистрацию, вход,
    управление задачами и заметками, а также просмотр расписания по группе.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Ktor Backend (основной API)
  - url: http://localhost:8000/api/v1
    description: FastAPI Parser (внутренний API)

tags:
  - name: auth
    description: Аутентификация
  - name: tasks
    description: Задачи пользователя
  - name: notes
    description: Заметки пользователя
  - name: schedule
    description: Расписание занятий
  - name: groups
    description: Справочник групп
  - name: university
    description: Подключение к ИС университета (university-sync)
  - name: parser
    description: Парсер расписания (внутренний API)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Общие схемы
    ErrorResponse:
      $ref: './common.yaml#/ErrorResponse'

    # Backend API схемы — единый источник: api/schemas/*.json (генерируется из shared)
    User:
      $ref: './backend-api.yaml#/User'
    RegisterRequest:
      $ref: './backend-api.yaml#/RegisterRequest'
    LoginRequest:
      $ref: './backend-api.yaml#/LoginRequest'
    LoginResponse:
      $ref: './backend-api.yaml#/LoginResponse'
    Task:
      $ref: './backend-api.yaml#/Task'
    TaskInput:
      $ref: './backend-api.yaml#/TaskInput'
    Note:
      $ref: './backend-api.yaml#/Note'
    NoteInput:
      $ref: './backend-api.yaml#/NoteInput'
    Lesson:
      $ref: './backend-api.yaml#/Lesson'
    GroupInfo:
      $ref: './backend-api.yaml#/GroupInfo'

    # Схемы контура университета (university-sync)
    Institute:
      $ref: './backend-api.yaml#/Institute'
    Specialty:
      $ref: './backend-api.yaml#/Specialty'
    AcademicGroup:
      $ref: './backend-api.yaml#/AcademicGroup'
    Teacher:
      $ref: './backend-api.yaml#/Teacher'
    Room:
      $ref: './backend-api.yaml#/Room'
    CaptchaChallengeResponse:
      $ref: './backend-api.yaml#/CaptchaChallengeResponse'
    UniversityLoginRequest:
      $ref: './backend-api.yaml#/UniversityLoginRequest'
    UniversityLinkStatus:
      $ref: './backend-api.yaml#/UniversityLinkStatus'
    ParserStatusResponse:
      $ref: './backend-api.yaml#/ParserStatusResponse'
    ParserSyncRequest:
      $ref: './backend-api.yaml#/ParserSyncRequest'
    ParserSyncResponse:
      $ref: './backend-api.yaml#/ParserSyncResponse'

paths:
  # Backend API paths
  /auth/register:
    $ref: './backend-api.yaml#/auth_register'
  /auth/login:
    $ref: './backend-api.yaml#/auth_login'
  /auth/me:
    $ref: './backend-api.yaml#/auth_me'
  /tasks:
    $ref: './backend-api.yaml#/tasks_collection'
  /tasks/{id}:
    $ref: './backend-api.yaml#/tasks_item'
  /notes:
    $ref: './backend-api.yaml#/notes_collection'
  /notes/{id}:
    $ref: './backend-api.yaml#/notes_item'
  /schedule:
    $ref: './backend-api.yaml#/schedule_get'
  /groups:
    $ref: './backend-api.yaml#/groups_get'

  # University Auth paths (university-sync)
  /university-auth/captcha:
    $ref: './backend-api.yaml#/university_auth_captcha'
  /university-auth/login:
    $ref: './backend-api.yaml#/university_auth_login'
  /university-auth/status:
    $ref: './backend-api.yaml#/university_auth_status'
  /university-auth/link:
    $ref: './backend-api.yaml#/university_auth_link'

  # Parser API paths
  /parser/status:
    $ref: './parser-api.yaml#/parser_status'
  /parser/sync:
    $ref: './parser-api.yaml#/parser_sync'
  /parser/institutes:
    $ref: './parser-api.yaml#/parser_institutes'
  /parser/specialties:
    $ref: './parser-api.yaml#/parser_specialties'
  /parser/groups:
    $ref: './parser-api.yaml#/parser_groups'
  # GET /parser/lessons — целевой контракт backend→parser (по university-sync design).
  # Описан здесь, т.к. api/parser-api.yaml — контракт независимого микросервиса и в этой
  # итерации не меняется; реализация эндпоинта — отдельный этап A работы по парсеру.
  /parser/lessons:
    get:
      tags: [parser]
      summary: Занятия по группе за период (внутренний эндпоинт парсера)
      description: 'Возвращает занятия группы за период; используется backend''ом для синхронизации личного расписания'
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
          description: 'Название группы (например, "ИТ-201")'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 'Начало периода (YYYY-MM-DD)'
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 'Конец периода (YYYY-MM-DD)'
      responses:
        '200':
          description: Список занятий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './backend-api.yaml#/Lesson'
        '400':
          description: Ошибка в параметрах
        '404':
          description: Группа не найдена
