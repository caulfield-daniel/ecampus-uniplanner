# --- Schedule Paths ---
schedule_get:
  get:
    tags: [schedule]
    summary: Расписание по группе
    parameters:
      - $ref: './common.yaml#/GroupIdParam'
      - $ref: './common.yaml#/DateQueryParam'
    responses:
      '200':
        description: Список занятий
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/Lesson'
      '400':
        description: Неверные параметры
      '404':
        description: Группа не найдена

# --- Groups Paths ---
groups_get:
  get:
    tags: [groups]
    summary: Все группы
    responses:
      '200':
        description: Список групп
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/GroupInfo'
