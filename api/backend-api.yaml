# ============================================
# BACKEND API (Ktor)
# Публичный API для клиентов (Web, Android)
# ============================================

# --- Auth Schemas ---
User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    fullName:
      type: string
    groupName:
      type: string
  required: [id, email, fullName, groupName]

RegisterRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 6
    fullName:
      type: string
    groupName:
      type: string
  required: [email, password, fullName, groupName]

LoginRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    password:
      type: string
  required: [email, password]

LoginResponse:
  type: object
  properties:
    token:
      type: string
    user:
      $ref: '#/User'
  required: [token, user]

# --- Task Schemas ---
Task:
  type: object
  properties:
    id:
      type: integer
    title:
      type: string
    description:
      type: string
      nullable: true
    deadline:
      type: string
      format: date-time
    priority:
      type: integer
      minimum: 1
      maximum: 5
    completed:
      type: boolean
  required: [id, title, deadline, priority, completed]

TaskInput:
  type: object
  properties:
    title:
      type: string
    description:
      type: string
    deadline:
      type: string
      format: date-time
    priority:
      type: integer
    completed:
      type: boolean
  required: [title, deadline, priority]

# --- Note Schemas ---
Note:
  type: object
  properties:
    id:
      type: integer
    title:
      type: string
    content:
      type: string
  required: [id, title, content]

NoteInput:
  type: object
  properties:
    title:
      type: string
    content:
      type: string
  required: [title, content]

# --- Schedule Schemas ---
Lesson:
  type: object
  description: 'Занятие в расписании'
  properties:
    id:
      type: integer
    group:
      type: string
    date:
      type: string
      format: date
    weekday:
      type: string
    discipline:
      type: string
    type:
      type: string
    timeStart:
      type: string
      format: time
    timeEnd:
      type: string
      format: time
    teacher:
      type: string
      nullable: true
    room:
      type: string
      nullable: true
    subgroup:
      type: string
      nullable: true
  required: [id, group, discipline, type, timeStart, timeEnd]

GroupInfo:
  type: object
  properties:
    id:
      type: integer
    name:
      type: string
    institute:
      type: string
      nullable: true
    specialty:
      type: string
      nullable: true
  required: [id, name]

# --- Auth Paths ---
auth_register:
  post:
    tags: [auth]
    summary: Регистрация
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/RegisterRequest'
    responses:
      '201':
        description: Пользователь создан
        content:
          application/json:
            schema:
              $ref: '#/LoginResponse'
      '400':
        description: Ошибка ввода
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ErrorResponse'

auth_login:
  post:
    tags: [auth]
    summary: Вход
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/LoginRequest'
    responses:
      '200':
        description: Успешный вход
        content:
          application/json:
            schema:
              $ref: '#/LoginResponse'
      '401':
        description: Неверные данные

auth_me:
  get:
    tags: [auth]
    summary: Профиль
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Данные пользователя
        content:
          application/json:
            schema:
              $ref: '#/User'
      '401':
        description: Не авторизован

# --- Tasks Paths ---
tasks_collection:
  get:
    tags: [tasks]
    summary: Список задач
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Список задач
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/Task'
      '401':
        description: Не авторизован

  post:
    tags: [tasks]
    summary: Создать задачу
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/TaskInput'
    responses:
      '201':
        description: Задача создана
        content:
          application/json:
            schema:
              $ref: '#/Task'
      '400':
        description: Ошибка валидации
      '401':
        description: Не авторизован

tasks_item:
  get:
    tags: [tasks]
    summary: Получить задачу
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    responses:
      '200':
        description: Задача найдена
        content:
          application/json:
            schema:
              $ref: '#/Task'
      '404':
        description: Не найдена
      '401':
        description: Не авторизован

  put:
    tags: [tasks]
    summary: Обновить задачу
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/TaskInput'
    responses:
      '200':
        description: Обновлена
        content:
          application/json:
            schema:
              $ref: '#/Task'
      '400':
      '404':
      '401':

  delete:
    tags: [tasks]
    summary: Удалить задачу
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    responses:
      '204':
        description: Удалена
      '404':
      '401':

# --- Notes Paths ---
notes_collection:
