    summary: Список заметок
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Список заметок
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/Note'
      '401':

  post:
    tags: [notes]
    summary: Создать заметку
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/NoteInput'
    responses:
      '201':
        description: Заметка создана
        content:
          application/json:
            schema:
              $ref: '#/Note'
      '400':
      '401':

notes_item:
  get:
    tags: [notes]
    summary: Получить заметку
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/Note'
      '404':
      '401':

  put:
    tags: [notes]
    summary: Обновить заметку
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/NoteInput'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '#/Note'
      '400':
      '404':
      '401':

  delete:
    tags: [notes]
    summary: Удалить заметку
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    responses:
      '204':
        description: Удалена
      '404':
      '401':

# --- Schedule Paths ---
schedule_get:
  get:
    tags: [schedule]
    summary: Расписание по группе
    parameters:
      - $ref: './common.yaml#/GroupIdParam'
      - $ref: './common.yaml#/DateQueryParam'
    responses:
      '200':
        description: Список занятий
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/Lesson'
      '400':
        description: Неверные параметры
      '404':
        description: Группа не найдена

# --- Groups Paths ---
groups_get:
  get:
    tags: [groups]
    summary: Все группы
    responses:
      '200':
        description: Список групп
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/GroupInfo'
