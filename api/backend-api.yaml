# ============================================
# BACKEND API (Ktor)
# Публичный API для клиентов (Web, Android)
# ============================================

# --- Схемы ---
# Единый источник истины моделей — KMP shared (shared/ApiModels.kt).
# Все схемы — внешние $ref на сгенерированные файлы api/schemas/*.json
# (./gradlew :shared:generateJsonSchemas). Ручные дубли запрещены.
User:
  $ref: './schemas/User.json'
RegisterRequest:
  $ref: './schemas/RegisterRequest.json'
LoginRequest:
  $ref: './schemas/LoginRequest.json'
LoginResponse:
  $ref: './schemas/LoginResponse.json'

# --- Task Schemas ---
Task:
  $ref: './schemas/Task.json'
TaskInput:
  $ref: './schemas/TaskInput.json'

# --- Note Schemas ---
Note:
  $ref: './schemas/Note.json'
NoteInput:
  $ref: './schemas/NoteInput.json'

# --- Schedule Schemas ---
Lesson:
  $ref: './schemas/Lesson.json'
GroupInfo:
  $ref: './schemas/GroupInfo.json'

# --- University Schemas (контур университета, university-sync) ---
Institute:
  $ref: './schemas/Institute.json'
Specialty:
  $ref: './schemas/Specialty.json'
AcademicGroup:
  $ref: './schemas/AcademicGroup.json'
Teacher:
  $ref: './schemas/Teacher.json'
Room:
  $ref: './schemas/Room.json'
CaptchaChallengeResponse:
  $ref: './schemas/CaptchaChallengeResponse.json'
UniversityLoginRequest:
  $ref: './schemas/UniversityLoginRequest.json'
UniversityLinkStatus:
  $ref: './schemas/UniversityLinkStatus.json'
ParserStatusResponse:
  $ref: './schemas/ParserStatusResponse.json'
ParserSyncRequest:
  $ref: './schemas/ParserSyncRequest.json'
ParserSyncResponse:
  $ref: './schemas/ParserSyncResponse.json'

# --- Auth Paths ---
auth_register:
  post:
    tags: [auth]
    summary: Регистрация
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/RegisterRequest'
    responses:
      '201':
        description: Пользователь создан
        content:
          application/json:
            schema:
              $ref: '#/LoginResponse'
      '400':
        description: Ошибка ввода
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ErrorResponse'

auth_login:
  post:
    tags: [auth]
    summary: Вход
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/LoginRequest'
    responses:
      '200':
        description: Успешный вход
        content:
          application/json:
            schema:
              $ref: '#/LoginResponse'
      '401':
        description: Неверные данные

auth_me:
  get:
    tags: [auth]
    summary: Профиль
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Данные пользователя
        content:
          application/json:
            schema:
              $ref: '#/User'
      '401':
        description: Не авторизован

# --- University Auth Paths (контур университета, university-sync) ---
university_auth_captcha:
  post:
    tags: [university]
    summary: Запросить капчу для входа в ИС университета
    responses:
      '200':
        description: Новая капча (attemptId + base64-изображение)
        content:
          application/json:
            schema:
              $ref: '#/CaptchaChallengeResponse'
      '503':
        description: Парсер недоступен
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ErrorResponse'

university_auth_login:
  post:
    tags: [university]
    summary: Войти в ИС университета (логин + пароль + капча)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/UniversityLoginRequest'
    responses:
      '200':
        description: Учётная запись подключена
        content:
          application/json:
            schema:
              $ref: '#/UniversityLinkStatus'
      '400':
        description: Неверная капча или учётные данные
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ErrorResponse'
      '503':
        description: Парсер недоступен
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ErrorResponse'

university_auth_status:
  get:
    tags: [university]
    summary: Статус подключения к ИС университета
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Статус подключения
        content:
          application/json:
            schema:
              $ref: '#/UniversityLinkStatus'
      '401':
        description: Не авторизован
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ErrorResponse'

university_auth_link:
  delete:
    tags: [university]
    summary: Отключить учётную запись ИС университета
    security: [{ bearerAuth: [] }]
    responses:
      '204':
        description: Учётная запись отключена
      '401':
        description: Не авторизован
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ErrorResponse'

# --- Tasks Paths ---
tasks_collection:
  get:
    tags: [tasks]
    summary: Список задач
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Список задач
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/Task'
      '401':
        description: Не авторизован

  post:
    tags: [tasks]
    summary: Создать задачу
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/TaskInput'
    responses:
      '201':
        description: Задача создана
        content:
          application/json:
            schema:
              $ref: '#/Task'
      '400':
        description: Ошибка валидации
      '401':
        description: Не авторизован

tasks_item:
  get:
    tags: [tasks]
    summary: Получить задачу
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    responses:
      '200':
        description: Задача найдена
        content:
          application/json:
            schema:
              $ref: '#/Task'
      '404':
        description: Не найдена
      '401':
        description: Не авторизован

  put:
    tags: [tasks]
    summary: Обновить задачу
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/TaskInput'
    responses:
      '200':
        description: Обновлена
        content:
          application/json:
            schema:
              $ref: '#/Task'
      '400':
      '404':
      '401':

  delete:
    tags: [tasks]
    summary: Удалить задачу
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: './common.yaml#/IdPathParameter'
    responses:
      '204':
        description: Удалена
      '404':
      '401':

