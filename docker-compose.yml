services:
  postgres-backend:
    image: postgres:16
    environment:
      POSTGRES_DB: uniplanner_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-backend-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres-backend:
        condition: service_healthy
    environment:
      DB_HOST: postgres-backend
      DB_PORT: 5432
      DB_NAME: uniplanner_backend
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-secret-key-change-in-production-min-256-bits-long-for-hs256
      UNIVERSITY_AUTH_ENCRYPTION_KEY: dev-university-auth-encryption-key-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
      # Парсер запускается на хосте (не в этом docker-compose) — из контейнера backend'а
      # "localhost" указывал бы на сам контейнер, а не на хост, поэтому host.docker.internal.
      PARSER_BASE_URL: http://host.docker.internal:8000/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  postgres-backend-data:
