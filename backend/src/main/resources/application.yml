server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:uniplanner_backend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

app:
  parser:
    base-url: ${PARSER_BASE_URL:http://localhost:8000/api/v1}
    timeout-seconds: 30
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits-long-for-hs256}
    expiration-ms: 86400000
  university-auth:
    encryption-key: ${UNIVERSITY_AUTH_ENCRYPTION_KEY:dev-university-auth-encryption-key-change-in-production}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

logging:
  level:
    root: INFO
    ru.uniplanner.backend: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"